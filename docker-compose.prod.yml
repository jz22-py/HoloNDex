# Lean production stack for the Droplet: Gunicorn + Postgres.
# Frontend stays on Cloudflare Pages. Daily prices: host cron →
#   docker compose --env-file .env.prod -f docker-compose.prod.yml exec -T web python manage.py fetch_prices
#
# Usage on the Droplet:
#   cp .env.prod.example .env.prod   # then edit secrets / hosts
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
#
# --env-file is required so ${POSTGRES_*} in this file resolve from .env.prod.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published — only reachable from other containers on this network

  web:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      # Always talk to the compose Postgres service (overrides any localhost URL)
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
